<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup | Budget Trip Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="signup" class="auth-page-body">
  <header class="site-header compact-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">
        <span class="brand-mark">✈</span>
        <span>Budget Trip Planner</span>
      </a>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card glass-card">
      <div class="auth-card-head">
        <h1>Create account</h1>
        <p>Sign up with LocalStorage-based authentication to save favorites and access trip tools.</p>
      </div>

      <form id="signupForm" class="auth-form">
        <div class="filter-group">
          <label for="signupName">Full name</label>
          <input id="signupName" type="text" placeholder="Enter your full name" required />
        </div>
        <div class="filter-group">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" type="email" placeholder="Enter your email" required />
        </div>
        <div class="filter-group">
          <label for="signupPassword">Password</label>
          <input id="signupPassword" type="password" minlength="6" placeholder="Create a password" required />
        </div>
        <button class="primary-btn full-width" type="submit">Sign up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      <a class="text-link" href="index.html">← Back to home</a>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
