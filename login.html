<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Budget Trip Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login" class="auth-page-body">
  <header class="site-header compact-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">
        <span class="brand-mark">✈</span>
        <span>Budget Trip Planner</span>
      </a>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card glass-card">
      <div class="auth-card-head">
        <h1>Welcome back</h1>
        <p>Login to unlock destination details and use the budget calculator.</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="filter-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="Enter your email" required />
        </div>
        <div class="filter-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="Enter your password" required />
        </div>
        <button class="primary-btn full-width" type="submit">Login</button>
      </form>

      <p class="auth-switch">Don’t have an account? <a href="signup.html">Create one</a></p>
      <a class="text-link" href="index.html">← Back to home</a>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
